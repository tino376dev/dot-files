[general]
import = ["~/.config/alacritty/dank-theme.toml"]
live_config_reload = true

[terminal.shell]
program = "nu"

[window.padding]
x = 10
y = 10

[font]
size = 12

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[font.bold]
family = "Noto Sans Mono"
style = "Bold"

[font.italic]
family = "Noto Sans Mono"
style = "Italic"

[keyboard]
bindings = [
  { key = "PageUp", mods = "Control", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Control", action = "ScrollPageDown" },
  { key = "Up", mods = "Control", action = "ScrollLineUp" },
  { key = "K", mods = "Control", action = "ScrollLineUp" },
  { key = "Down", mods = "Control", action = "ScrollLineDown" },
  { key = "J", mods = "Control", action = "ScrollLineDown" },
  { key = "Home", mods = "Control", action = "ScrollToTop" },
  { key = "End", mods = "Control", action = "ScrollToBottom" },
  { key = "Slash", mods = "Control", action = "SearchBackward" },
  { key = "Enter", mods = "Control", command = { program = "sh", args = ["-c", "alacritty --working-directory $PWD"] } },
]

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "Space", mods = "Control" }
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^⟨⟩`\\]+'