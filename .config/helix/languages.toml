[[language]]
name = "nu"
auto-format = true
formatter = { command = "topiary", args = ["format", "--language", "nu"] }

[[language]]
name = "markdown"
auto-format = true
formatter = { command = "sh", args = ["-c", 'exec dprint fmt --config "${XDG_CONFIG_HOME:-$HOME/.config}/dprint/config.json" --stdin md'] }

[[language]]
name = "json"
